[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-checker"
version = "0.1.0"
description = "Explains AI-written code changes, flags what is broken or unrelated, and proposes fixes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "pydantic>=2.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
ai-code-checker = "ai_code_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
